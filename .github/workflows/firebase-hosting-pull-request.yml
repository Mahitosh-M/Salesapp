name: Preview Salesapp on Firebase Hosting
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USE_EMULATORS: "false"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/695799416355/locations/global/workloadIdentityPools/github-salesapp/providers/github
          service_account: github-actions-salesapp@salesapp-aaa7b.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@15.24.0 hosting:channel:deploy pr-${{ github.event.pull_request.number }} --project salesapp-aaa7b --expires 7d --non-interactive
